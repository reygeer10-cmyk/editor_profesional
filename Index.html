<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mi Editor Pro</title>
  
  <!-- ICONO DE LA APP (Favicon en formato SVG) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%231e1e1e'/%3E%3Cpath d='M0 100 h512 v0 a100 100 0 0 0 -100 -100 h-312 a100 100 0 0 0 -100 100 z' fill='%23ffffff' opacity='0.2'/%3E%3Crect x='110' y='150' width='292' height='292' rx='20' fill='%23252526' stroke='%23444' stroke-width='12'/%3E%3Cpath d='M190 260 L140 300 L190 340' fill='none' stroke='%23569cd6' stroke-width='24' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M322 260 L372 300 L322 340' fill='none' stroke='%23569cd6' stroke-width='24' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M270 230 L240 370' fill='none' stroke='%23ce9178' stroke-width='24' stroke-linecap='round'/%3E%3Crect x='150' y='380' width='212' height='15' rx='7.5' fill='%236a9955'/%3E%3Crect x='150' y='410' width='140' height='15' rx='7.5' fill='%23444'/%3E%3C/svg%3E">

  <style>
    * { box-sizing: border-box; }
    
    html, body { 
      margin: 0; padding: 0; height: 100%; overflow: hidden; 
      transition: background 0.3s; touch-action: pan-x pan-y; 
    }
    
    body {
      display: flex; flex-direction: column;
      -webkit-text-size-adjust: 100%;
    }
    
    /* Variables de color y configuración */
    :root {
      --bg-editor: #ffffff; --bg-gutter: #f2f2f2; --text-color: #000000;
      --border-color: #ddd; --gutter-color: #888; --bg-tools: #f8f8f8;
      --text-tools: #333; --bg-status: #f2f2f2; --text-status: #333;
      --link-color: #0015FF;
      --font-size: 16px;
      --font-family: 'Consolas', 'Courier New', monospace;
      --white-space: pre-wrap;
    }

    body.tema-oscuro {
      --bg-editor: #1e1e1e; --bg-gutter: #1e1e1e; --text-color: #d4d4d4;
      --border-color: #444; --gutter-color: #858585; --bg-tools: #252526;
      --text-tools: #fff; --bg-status: #007acc; --text-status: #ffffff;
    }

    body.tema-oscuro { background: #1e1e1e; color: #fff; }

    /* La barra superior ahora contiene el Logo */
    .box { 
      background: #2739FF; 
      width: 100%; 
      height: 50px; 
      flex-shrink: 0; 
    }

    .tools {
      display: flex; flex-wrap: wrap; align-items: center;
      gap: 8px; padding: 10px; border-bottom: 1px solid var(--border-color);
      background: var(--bg-tools); color: var(--text-tools);
      transition: background 0.3s; flex-shrink: 0;
    }
    .tools .label { font-weight: bold; margin-right: 5px; font-family: sans-serif; font-size: 14px; }
    .tools button {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 12px; cursor: pointer; border: 1px solid var(--border-color);
      border-radius: 4px; background: var(--bg-editor); color: var(--text-tools); 
      font-family: sans-serif; font-size: 13px; font-weight: 500; transition: 0.2s;
    }
    .tools button:hover { filter: brightness(0.9); }
    .tools button svg { width: 16px; height: 16px; fill: currentColor; }
    .tools .btn-ajustes { margin-left: auto; border-color: #2739FF; color: #2739FF; }
    body.tema-oscuro .tools .btn-ajustes { color: #569cd6; border-color: #569cd6; }

    /* --- PANELES --- */
    .panel-ajustes, .panel-buscar {
      display: none; position: absolute; top: 120px; right: 20px;
      background: var(--bg-editor); border: 1px solid var(--border-color);
      padding: 20px; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.4);
      z-index: 100; font-family: sans-serif; width: 320px; color: var(--text-color);
      max-height: 75vh; overflow-y: auto;
    }
    .panel-ajustes h3 { margin: 0 0 15px 0; font-size: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; text-align: center;}
    
    .seccion-ajuste { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed var(--border-color); }
    .seccion-ajuste:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .seccion-ajuste h4 { margin: 0 0 10px 0; font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    
    .opcion-grupo { margin-bottom: 12px; }
    .opcion-grupo label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: bold; }
    .switch-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .switch-group button, .btn-accion {
      flex: 1; padding: 8px; cursor: pointer; border: 1px solid var(--border-color);
      background: var(--bg-tools); color: var(--text-color); border-radius: 4px;
      font-weight: bold; font-size: 12px; transition: 0.2s;
    }
    .switch-group button.activo { background: #2739FF; color: #fff; border-color: #2739FF; }
    .switch-group button:hover, .btn-accion:hover { filter: brightness(0.9); }
    
    .input-color, .select-fuente { 
      width: 100%; height: 35px; cursor: pointer; border: 1px solid var(--border-color); 
      border-radius: 4px; background: var(--bg-tools); color: var(--text-color); padding: 0 5px; font-family: sans-serif;
    }
    
    .panel-ajustes .btn-cerrar, .panel-buscar .btn-cerrar {
      width: 100%; padding: 10px; background: #ff4d4d; color: white; border: none;
      border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px;
    }
    .panel-buscar input {
      width: 100%; margin-bottom: 10px; padding: 8px;
      border: 1px solid var(--border-color); background: var(--bg-gutter); color: var(--text-color);
      border-radius: 4px; outline: none;
    }
    .panel-buscar .btn-reemplazar {
      width: 100%; padding: 8px 12px; cursor: pointer; border: none; border-radius: 4px;
      background: #2739FF; color: white; font-weight: bold; margin-bottom: 5px;
    }

    /* --- EDITOR --- */
    .editor-wrap {
      display: flex; width: 99%; margin: 10px auto 0 auto; flex: 1;
      border: 1px solid var(--border-color); background: var(--bg-editor);
      position: relative; font-family: var(--font-family);
      font-size: var(--font-size); line-height: 1.5; overflow: hidden; transition: background 0.3s;
    }

    .gutter {
      width: 50px; min-width: 50px; background: var(--bg-gutter); color: var(--gutter-color);
      text-align: right; padding: 10px 8px 10px 0; overflow: hidden; 
      user-select: none; border-right: 1px solid var(--border-color);
      font-family: var(--font-family); font-size: var(--font-size); line-height: 1.5;
    }
    .gutter div { height: 1.5em; }

    .editor-container { position: relative; flex: 1; overflow: hidden; }

    .highlighting {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      padding: 10px; 
      white-space: var(--white-space); 
      word-wrap: break-word;
      color: var(--text-color); pointer-events: none; 
      overflow-y: auto; overflow-x: auto; 
      font-family: var(--font-family); font-size: var(--font-size); line-height: 1.5;
    }

    .tex {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      padding: 10px; background: transparent; color: transparent;
      caret-color: var(--text-color); border: none; outline: none; resize: none;
      font-family: var(--font-family); font-size: var(--font-size); line-height: 1.5;
      white-space: var(--white-space);
      word-wrap: break-word;
      overflow-y: auto; overflow-x: auto;
    }
    .tex::selection { background: rgba(100, 150, 255, 0.4); color: transparent; }

    /* --- BARRA DE ESTADO --- */
    .status-bar {
      display: flex; align-items: center; justify-content: flex-end;
      background: var(--bg-status); color: var(--text-status);
      font-family: sans-serif; font-size: 12px; padding: 4px 15px; gap: 15px;
      flex-shrink: 0; border-top: 1px solid var(--border-color); user-select: none;
    }

    /* Colores Sintaxis */
    .tag { color: #569cd6; } .attr { color: #9cdcfe; } .string { color: #ce9178; }
    .comment { color: #6a9955; font-style: italic; } .keyword { color: #c586c0; }
    .function { color: #dcdcaa; } .number { color: #b5cea8; }
    
    /* Enlaces Dinámicos */
    .highlighting .link { color: var(--link-color) !important; text-decoration: underline; cursor: pointer; pointer-events: auto; }

    /* --- MODALES Y NAVEGADOR --- */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center; z-index: 999;
    }
    .modal { background: var(--bg-editor); padding: 20px; border-radius: 8px; min-width: 300px; color: var(--text-color); }
    .modal h3 { margin-top: 0; text-align: center; }
    .btn-cancelar { display: block; margin: 15px auto 0; padding: 8px 20px; cursor: pointer; border: none; background: #888; color: #fff; border-radius: 4px; }
    .lenguajes-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
    .lenguajes-grid button { padding: 12px; cursor: pointer; border: 1px solid var(--border-color); background: var(--bg-tools); color: var(--text-color); border-radius: 6px; font-weight: bold; }
    .lenguajes-grid button:hover { background: #2739FF; color: #fff; border-color: #2739FF; }
    .modal ul { list-style: none; padding: 0; margin: 0; }
    .enlace-btn { width: 100%; text-align: left; padding: 10px; border: 1px solid var(--border-color); background: var(--bg-tools); color: var(--text-color); border-radius: 6px; cursor: pointer; margin-bottom: 5px; }

    #navegadorInterno { display: none; position: fixed; inset: 0; background: #1e1e1e; z-index: 9999; flex-direction: column; }
    .barra-navegador { display: flex; align-items: center; gap: 10px; background: #2d2d2d; padding: 10px 15px; color: white; font-family: sans-serif; }
    .barra-navegador span { flex: 1; background: #1e1e1e; padding: 8px 12px; border-radius: 4px; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .barra-navegador button { display: flex; align-items: center; gap: 5px; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-nav-recargar { background: #444; color: white; } .btn-nav-externo { background: #2739FF; color: white; } .btn-nav-cerrar { background: #ff4d4d; color: white; }
    .barra-navegador button svg { width: 14px; height: 14px; fill: currentColor; }
    #iframeNavegador { flex: 1; width: 100%; border: none; background: white; }
    
    /* Panel de Emojis */
    #panelEmojis {
      display: none; position: absolute; top: 120px; right: 100px;
      background: var(--bg-editor); border: 1px solid var(--border-color);
      padding: 10px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      z-index: 100; grid-template-columns: repeat(4, 1fr); gap: 5px; width: 180px;
    }
    #panelEmojis button { font-size: 20px; padding: 5px; background: transparent; border: none; cursor: pointer; border-radius: 4px; }
    #panelEmojis button:hover { background: var(--bg-gutter); }
  </style>
</head>
<body class="tema-oscuro">

  <div id="panelEmojis">
    <button>😀</button><button>😂</button><button>😍</button><button>🔥</button>
    <button>🚀</button><button>👍</button><button>💻</button><button>❤️</button>
    <button>💡</button><button>✅</button><button>❌</button><button>⚡</button>

  <div class="panel-ajustes" id="panelAjustes">
    <h3>Configuración</h3>
    
    <div class="seccion-ajuste">
      <h4>Apariencia</h4>
      <div class="opcion-grupo">
        <label>Tema Visual:</label>
        <div class="switch-group">
          <button id="btnTemaClaro">Claro</button>
          <button id="btnTemaOscuro" class="activo">Oscuro</button>
        </div>
      </div>
      <div class="opcion-grupo">
        <label>Resaltado Sintaxis:</label>
        <div class="switch-group">
          <button id="btnSintaxisOn" class="activo">Activado</button>
          <button id="btnSintaxisOff">Desactivado</button>
        </div>
      </div>
      <div class="opcion-grupo">
        <label>Color de Enlaces:</label>
        <input type="color" id="colorEnlaces" class="input-color" value="#0015FF">
      </div>
    </div>

    <div class="seccion-ajuste">
      <h4>Tipografía y Texto</h4>
      <div class="opcion-grupo">
        <label>Fuente de Letra:</label>
        <select id="selectFuente" class="select-fuente">
          <option value="'Consolas', 'Courier New', monospace">Monoespaciada (Consolas)</option>
          <option value="Arial, Helvetica, sans-serif">Sans-Serif (Arial)</option>
          <option value="'Times New Roman', Times, serif">Serif (Times New Roman)</option>
          <option value="'Comic Sans MS', 'Comic Sans', cursive">Cursiva (Comic Sans)</option>
          <option value="system-ui, -apple-system, sans-serif">Sistema (Nativa)</option>
        </select>
      </div>
      <div class="opcion-grupo">
        <label>Tamaño de Letra:</label>
        <div class="switch-group">
          <button id="btnAumentarFuente">A+</button>
          <button id="btnDisminuirFuente">A-</button>
        </div>
      </div>
      <div class="opcion-grupo">
        <label>Fila Infinita (Sin salto de línea):</label>
        <div class="switch-group">
          <button id="btnFilaInfinitaOn">Activado</button>
          <button id="btnFilaInfinitaOff" class="activo">Desactivado</button>
        </div>
      </div>
    </div>

    <div class="seccion-ajuste">
      <h4>Configuración de Enlaces</h4>
      <div class="opcion-grupo">
        <label>Forzar minúsculas en enlaces:</label>
        <div class="switch-group">
          <button id="btnMinusculasOn" class="activo">Activado</button>
          <button id="btnMinusculasOff">Desactivado</button>
        </div>
      </div>
      <div class="opcion-grupo">
        <label>Corregir enlaces actuales:</label>
        <div class="switch-group">
          <button id="btnArreglarEnlaces" class="btn-accion" style="background:#2739FF; color:white; border-color:#2739FF;">Pasar todo a minúsculas</button>
        </div>
      </div>
    </div>

    <div class="seccion-ajuste">
      <h4>Herramientas</h4>
      <div class="opcion-grupo">
        <label>Menú de Emojis:</label>
        <div class="switch-group">
          <button id="btnEmojisOn" class="activo">Activado</button>
          <button id="btnEmojisOff">Desactivado</button>
        </div>
      </div>
    </div>

    <button class="btn-cerrar" id="btnCerrarAjustes">Cerrar Configuración</button>
  </div>

  <div class="panel-buscar" id="panelBuscar">
    <input type="text" id="inputBuscar" placeholder="Buscar...">
    <input type="text" id="inputReemplazar" placeholder="Reemplazar con...">
    <button class="btn-reemplazar" id="btnReemplazarTodo">Reemplazar Todo</button>
    <button class="btn-cerrar" id="btnCerrarBuscar">Cerrar</button>
  </div>

  <div class="editor-wrap">
    <div class="gutter" id="gutter"></div>
    <div class="editor-container">
      <div class="highlighting" id="highlighting"></div>
      <textarea class="tex" id="editor" spellcheck="false"></textarea>
    </div>
  </div>

  <div class="status-bar">
    <span id="statusLnCol">Ln 1, Col 1</span>
    <span id="statusSel">Sel: 0</span>
    <span id="statusSp">SP: 0</span>
    <span id="statusText">Text: 0</span>
    <span>LF</span>
    <span>UTF-8</span>
  </div>

  <div id="modalEnlaces" class="modal-overlay" style="display:none;">
    <div class="modal"><h3>Elige un enlace</h3><ul id="listaEnlaces"></ul><button id="cerrarModal" class="btn-cancelar">Cancelar</button></div>
  </div>

  <div id="modalLenguajes" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h3>Elige el lenguaje</h3>
      <div class="lenguajes-grid" id="listaLenguajes">
        <button data-lang="html">HTML</button><button data-lang="xml">XML</button>
        <button data-lang="python">Python</button><button data-lang="cpp">C++</button>
        <button data-lang="java">Java</button><button data-lang="css">CSS</button>
        <button data-lang="csharp">C#</button><button data-lang="js">JavaScript</button>
      </div>
      <button id="cerrarModalLang" class="btn-cancelar">Cancelar</button>
    </div>
  </div>

  <div id="navegadorInterno">
    <div class="barra-navegador">
      <button class="btn-nav-recargar" onclick="recargarNavegador()"><svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
      <span id="urlNavegador">https://...</span>
      <button class="btn-nav-externo" onclick="abrirEnPestanaExterna()"><svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg></button>
      <button class="btn-nav-cerrar" onclick="cerrarNavegador()"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
    </div>
    <iframe id="iframeNavegador" src="about:blank"></iframe>
  </div>

  <script>
    const editor = document.getElementById('editor');
    const gutter = document.getElementById('gutter');
    const highlighting = document.getElementById('highlighting');
    
    let modoSintaxis = true;
    let urlActual = '';
    let tamañoFuente = 16;
    let forzarMinusculas = true;
    let filaInfinita = false;

    // Cargar texto guardado
    const textoGuardado = localStorage.getItem('miEditorPro_autoguardado');
    if (textoGuardado) editor.value = textoGuardado;

    // Bloquear zoom
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('gestureend', e => e.preventDefault());

    // ---------- SISTEMA DE GUARDADO DE CONFIGURACIÓN ----------
    const CONFIG_KEY = 'miEditorPro_configuracion';

    function guardarConfiguracion() {
      const config = {
        temaOscuro: document.body.classList.contains('tema-oscuro'),
        modoSintaxis: modoSintaxis,
        colorEnlaces: document.getElementById('colorEnlaces').value,
        fuente: document.getElementById('selectFuente').value,
        tamañoFuente: tamañoFuente,
        filaInfinita: filaInfinita,
        forzarMinusculas: forzarMinusculas,
        emojisActivos: document.getElementById('btnEmoji').style.display !== 'none'
      };
      localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
    }

    function cargarConfiguracion() {
      const guardado = localStorage.getItem(CONFIG_KEY);
      if (!guardado) return;

      try {
        const cfg = JSON.parse(guardado);

        if (cfg.temaOscuro === false) {
          document.body.classList.remove('tema-oscuro');
          document.getElementById('btnTemaClaro').classList.add('activo');
          document.getElementById('btnTemaOscuro').classList.remove('activo');
        }

        if (cfg.modoSintaxis === false) {
          modoSintaxis = false;
          document.getElementById('btnSintaxisOff').classList.add('activo');
          document.getElementById('btnSintaxisOn').classList.remove('activo');
        }

        if (cfg.colorEnlaces) {
          document.getElementById('colorEnlaces').value = cfg.colorEnlaces;
          document.documentElement.style.setProperty('--link-color', cfg.colorEnlaces);
        }

        if (cfg.fuente) {
          document.getElementById('selectFuente').value = cfg.fuente;
          document.documentElement.style.setProperty('--font-family', cfg.fuente);
        }

        if (cfg.tamañoFuente) {
          tamañoFuente = cfg.tamañoFuente;
          document.documentElement.style.setProperty('--font-size', tamañoFuente + 'px');
        }

        if (cfg.filaInfinita === true) {
          filaInfinita = true;
          document.documentElement.style.setProperty('--white-space', 'pre');
          document.getElementById('btnFilaInfinitaOn').classList.add('activo');
          document.getElementById('btnFilaInfinitaOff').classList.remove('activo');
        }

        if (cfg.forzarMinusculas === false) {
          forzarMinusculas = false;
          document.getElementById('btnMinusculasOff').classList.add('activo');
          document.getElementById('btnMinusculasOn').classList.remove('activo');
        }

        if (cfg.emojisActivos === false) {
          document.getElementById('btnEmoji').style.display = 'none';
          document.getElementById('btnEmojisOff').classList.add('activo');
          document.getElementById('btnEmojisOn').classList.remove('activo');
        }

      } catch (e) {
        console.error("Error cargando la configuración", e);
      }
    }

    cargarConfiguracion();

    // ---------- LÓGICA DEL NAVEGADOR INTERNO ----------
    function abrirUrl(url) {
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      urlActual = url;
      document.getElementById('urlNavegador').textContent = url;
      document.getElementById('iframeNavegador').src = url;
      document.getElementById('navegadorInterno').style.display = 'flex';
    }
    function recargarNavegador() { if(urlActual) document.getElementById('iframeNavegador').src = urlActual; }
    function abrirEnPestanaExterna() { if(urlActual) window.open(urlActual, '_blank'); }
    function cerrarNavegador() {
      document.getElementById('navegadorInterno').style.display = 'none';
      document.getElementById('iframeNavegador').src = 'about:blank';
    }

    // ---------- BARRA DE ESTADO ----------
    function actualizarBarraEstado() {
      const texto = editor.value;
      const posCursor = editor.selectionStart;
      const posFin = editor.selectionEnd;
      const lineas = texto.substring(0, posCursor).split('\n');
      
      document.getElementById('statusLnCol').textContent = `Ln ${lineas.length}, Col ${lineas[lineas.length - 1].length + 1}`;
      document.getElementById('statusSel').textContent = `Sel: ${Math.abs(posFin - posCursor)}`;
      document.getElementById('statusSp').textContent = `SP: ${texto.length}`;
      document.getElementById('statusText').textContent = `Text: ${texto.length}`;
    }
    editor.addEventListener('keyup', actualizarBarraEstado);
    editor.addEventListener('click', actualizarBarraEstado);
    editor.addEventListener('select', actualizarBarraEstado);

    // ---------- COLORES Y AUTOGUARDADO ----------
    function actualizarTodo() {
      if (forzarMinusculas) {
        const urlRegexForzar = /(https?:\/\/[^\s]+|www\.[^\s]+|(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(?:\/[^\s]*)?)/gi;
        const nuevoValor = editor.value.replace(urlRegexForzar, (url) => url.toLowerCase());
        
        if (nuevoValor !== editor.value) {
          const start = editor.selectionStart;
          const end = editor.selectionEnd;
          editor.value = nuevoValor;
          editor.selectionStart = start;
          editor.selectionEnd = end;
        }
      }

      const codigo = editor.value;
      let html = codigo.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+|(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(?:\/[^\s]*)?)/gi;
      html = html.replace(urlRegex, (url) => {
        const urlLimpia = url.replace(/[.,;:!?)\]]+$/, '');
        const puntuacion = url.substring(urlLimpia.length);
        return `<a href="javascript:void(0)" onclick="abrirUrl('${urlLimpia}')" class="link">${urlLimpia}</a>${puntuacion}`;
      });

      if (modoSintaxis) {
        html = html.replace(/(\/\/.*|\/\*[\s\S]*?\*\/)/g, '<span class="comment">$1</span>');
        html = html.replace(/(&lt;\/?)([a-zA-Z0-9\-]+)(.*?)(\/?&gt;)/g, (match, p1, p2, p3, p4) => {
          let attrs = p3.replace(/([a-zA-Z\-]+)=(&quot;.*?&quot;|'.*?')/g, '<span class="attr">$1</span>=<span class="string">$2</span>');
          return `<span class="tag">${p1}${p2}</span>${attrs}<span class="tag">${p4}</span>`;
        });
        html = html.replace(/(&quot;.*?&quot;|'.*?')/g, '<span class="string">$1</span>');
        html = html.replace(/\b(function|const|let|var|if|else|for|while|return|class|def|import|from|public|private|void|int|new|print|console\.log)\b/g, '<span class="keyword">$1</span>');
        html = html.replace(/\b(\d+)\b/g, '<span class="number">$1</span>');
      }

      highlighting.innerHTML = html + '\n';
      
      highlighting.scrollTop = editor.scrollTop;
      highlighting.scrollLeft = editor.scrollLeft;
      gutter.scrollTop = editor.scrollTop;

      const lineas = codigo.split('\n').length;
      let htmlGutter = '';
      for (let i = 1; i <= lineas; i++) htmlGutter += `<div>${i}</div>`;
      gutter.innerHTML = htmlGutter;

      localStorage.setItem('miEditorPro_autoguardado', codigo);
      actualizarBarraEstado();
    }

    editor.addEventListener('input', actualizarTodo);
    editor.addEventListener('scroll', () => {
      highlighting.scrollTop = editor.scrollTop;
      highlighting.scrollLeft = editor.scrollLeft;
      gutter.scrollTop = editor.scrollTop;
    });
    
    window.addEventListener('resize', actualizarTodo);
    
    actualizarTodo();
    actualizarBarraEstado();

    // ---------- CONTROLES DE AJUSTES AVANZADOS ----------
    const panelAjustes = document.getElementById('panelAjustes');
    
    document.getElementById('btnAjustes').addEventListener('click', () => {
      panelAjustes.style.display = panelAjustes.style.display === 'block' ? 'none' : 'block';
      document.getElementById('panelBuscar').style.display = 'none'; 
      document.getElementById('panelEmojis').style.display = 'none';
    });
    document.getElementById('btnCerrarAjustes').addEventListener('click', () => panelAjustes.style.display = 'none');

    // Temas
    document.getElementById('btnTemaClaro').addEventListener('click', () => {
      document.body.classList.remove('tema-oscuro');
      document.getElementById('btnTemaClaro').classList.add('activo');
      document.getElementById('btnTemaOscuro').classList.remove('activo');
      guardarConfiguracion();
    });
    document.getElementById('btnTemaOscuro').addEventListener('click', () => {
      document.body.classList.add('tema-oscuro');
      document.getElementById('btnTemaOscuro').classList.add('activo');
      document.getElementById('btnTemaClaro').classList.remove('activo');
      guardarConfiguracion();
    });

    // Sintaxis
    document.getElementById('btnSintaxisOn').addEventListener('click', () => {
      modoSintaxis = true;
      document.getElementById('btnSintaxisOn').classList.add('activo');
      document.getElementById('btnSintaxisOff').classList.remove('activo');
      actualizarTodo();
      guardarConfiguracion();
    });
    document.getElementById('btnSintaxisOff').addEventListener('click', () => {
      modoSintaxis = false;
      document.getElementById('btnSintaxisOff').classList.add('activo');
      document.getElementById('btnSintaxisOn').classList.remove('activo');
      actualizarTodo();
      guardarConfiguracion();
    });

    // Color de Enlaces
    document.getElementById('colorEnlaces').addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--link-color', e.target.value);
      guardarConfiguracion();
    });

    // Fuente de Letra
    document.getElementById('selectFuente').addEventListener('change', (e) => {
      document.documentElement.style.setProperty('--font-family', e.target.value);
      setTimeout(actualizarTodo, 10);
      guardarConfiguracion();
    });

    // Tamaño de Fuente (A+ / A-)
    document.getElementById('btnAumentarFuente').addEventListener('click', () => {
      tamañoFuente += 1;
      document.documentElement.style.setProperty('--font-size', tamañoFuente + 'px');
      guardarConfiguracion();
    });
    document.getElementById('btnDisminuirFuente').addEventListener('click', () => {
      if (tamañoFuente > 10) {
        tamañoFuente -= 1;
        document.documentElement.style.setProperty('--font-size', tamañoFuente + 'px');
        guardarConfiguracion();
      }
    });

    // Fila Infinita
    document.getElementById('btnFilaInfinitaOn').addEventListener('click', () => {
      filaInfinita = true;
      document.documentElement.style.setProperty('--white-space', 'pre');
      document.getElementById('btnFilaInfinitaOn').classList.add('activo');
      document.getElementById('btnFilaInfinitaOff').classList.remove('activo');
      guardarConfiguracion();
    });
    document.getElementById('btnFilaInfinitaOff').addEventListener('click', () => {
      filaInfinita = false;
      document.documentElement.style.setProperty('--white-space', 'pre-wrap');
      document.getElementById('btnFilaInfinitaOff').classList.add('activo');
      document.getElementById('btnFilaInfinitaOn').classList.remove('activo');
      guardarConfiguracion();
    });

    // Configuración de Enlaces
    document.getElementById('btnMinusculasOn').addEventListener('click', () => {
      forzarMinusculas = true;
      document.getElementById('btnMinusculasOn').classList.add('activo');
      document.getElementById('btnMinusculasOff').classList.remove('activo');
      actualizarTodo();
      guardarConfiguracion();
    });
    document.getElementById('btnMinusculasOff').addEventListener('click', () => {
      forzarMinusculas = false;
      document.getElementById('btnMinusculasOff').classList.add('activo');
      document.getElementById('btnMinusculasOn').classList.remove('activo');
      guardarConfiguracion();
    });
    document.getElementById('btnArreglarEnlaces').addEventListener('click', () => {
      const urlRegexForzar = /(https?:\/\/[^\s]+|www\.[^\s]+|(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(?:\/[^\s]*)?)/gi;
      editor.value = editor.value.replace(urlRegexForzar, (url) => url.toLowerCase());
      actualizarTodo();
      alert('Enlaces corregidos a minúsculas.');
    });

    // Menú de Emojis
    const btnEmoji = document.getElementById('btnEmoji');
    document.getElementById('btnEmojisOn').addEventListener('click', () => {
      btnEmoji.style.display = 'flex';
      document.getElementById('btnEmojisOn').classList.add('activo');
      document.getElementById('btnEmojisOff').classList.remove('activo');
      guardarConfiguracion();
    });
    document.getElementById('btnEmojisOff').addEventListener('click', () => {
      btnEmoji.style.display = 'none';
      document.getElementById('panelEmojis').style.display = 'none';
      document.getElementById('btnEmojisOff').classList.add('activo');
      document.getElementById('btnEmojisOn').classList.remove('activo');
      guardarConfiguracion();
    });

    const panelEmojis = document.getElementById('panelEmojis');
    btnEmoji.addEventListener('click', () => {
      panelEmojis.style.display = panelEmojis.style.display === 'grid' ? 'none' : 'grid';
      document.getElementById('panelBuscar').style.display = 'none';
      document.getElementById('panelAjustes').style.display = 'none';
    });
    panelEmojis.addEventListener('click', (e) => {
      if(e.target.tagName === 'BUTTON') {
        const emoji = e.target.textContent;
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.slice(0, start) + emoji + editor.value.slice(end);
        editor.focus();
        editor.selectionStart = editor.selectionEnd = start + emoji.length;
        actualizarTodo();
      }
    });

    // ---------- RESTO DE HERRAMIENTAS ----------
    document.getElementById('btnBuscar').addEventListener('click', () => {
      const pb = document.getElementById('panelBuscar');
      pb.style.display = pb.style.display === 'block' ? 'none' : 'block';
      document.getElementById('panelAjustes').style.display = 'none';
      document.getElementById('panelEmojis').style.display = 'none';
      if(pb.style.display === 'block') document.getElementById('inputBuscar').focus();
    });
    document.getElementById('btnCerrarBuscar').addEventListener('click', () => document.getElementById('panelBuscar').style.display = 'none');
    
    document.getElementById('btnReemplazarTodo').addEventListener('click', () => {
      const buscar = document.getElementById('inputBuscar').value;
      const reemplazar = document.getElementById('inputReemplazar').value;
      if (!buscar) return alert('Escribe algo para buscar.');
      const regex = new RegExp(buscar.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      const r = (editor.value.match(regex) || []).length;
      if (r === 0) return alert('No se encontró.');
      editor.value = editor.value.replace(regex, reemplazar);
      actualizarTodo();
      alert(`Reemplazadas ${r} coincidencias.`);
    });

    document.getElementById('btnPegar').addEventListener('click', async () => {
      try {
        const t = await navigator.clipboard.readText();
        const s = editor.selectionStart, e = editor.selectionEnd;
        editor.value = editor.value.slice(0, s) + t + editor.value.slice(e);
        editor.selectionStart = editor.selectionEnd = s + t.length;
        editor.focus(); actualizarTodo();
      } catch (err) { alert('No se pudo pegar.'); }
    });
    document.getElementById('btnCopiar').addEventListener('click', async () => {
      const s = editor.value.substring(editor.selectionStart, editor.selectionEnd) || editor.value;
      try { await navigator.clipboard.writeText(s); alert('Copiado.'); } catch (err) { alert('Error.'); }
    });
    document.getElementById('btnGuardarComo').addEventListener('click', () => {
      const n = prompt('Nombre:', 'archivo.txt');
      if (n) descargarArchivo(n, editor.value);
    });
    document.getElementById('btnGuardar').addEventListener('click', () => descargarArchivo('archivo.txt', editor.value));
    function descargarArchivo(nombre, contenido) {
      const blob = new Blob([contenido], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = nombre;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    document.getElementById('btnAbrirEnlace').addEventListener('click', () => {
      const v = editor.value, s = editor.selectionStart, e = editor.selectionEnd;
      let txt = s !== e ? v.substring(s, e) : v.substring(v.lastIndexOf('\n', s) + 1, v.indexOf('\n', s) === -1 ? v.length : v.indexOf('\n', s));
      const urls = txt.match(/(https?:\/\/[^\s]+|www\.[^\s]+|(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(?:\/[^\s]*)?)/gi) || [];
      if (urls.length === 0) return alert('No hay enlaces.');
      const abrir = (u) => abrirUrl(u);
      if (urls.length === 1) return abrir(urls[0]);
      const le = document.getElementById('listaEnlaces'); le.innerHTML = '';
      urls.forEach(u => {
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.textContent = u; b.className = 'enlace-btn';
        b.onclick = () => { abrir(u); document.getElementById('modalEnlaces').style.display = 'none'; };
        li.appendChild(b); le.appendChild(li);
      });
      document.getElementById('modalEnlaces').style.display = 'flex';
    });
    document.getElementById('cerrarModal').addEventListener('click', () => document.getElementById('modalEnlaces').style.display = 'none');
    document.getElementById('modalEnlaces').addEventListener('click', (e) => { if (e.target.id === 'modalEnlaces') document.getElementById('modalEnlaces').style.display = 'none'; });
    
    document.getElementById('btnSintaxis').addEventListener('click', () => {
      if (!modoSintaxis) document.getElementById('btnSintaxisOn').click();
      document.getElementById('modalLenguajes').style.display = 'flex';
    });
    document.getElementById('cerrarModalLang').addEventListener('click', () => document.getElementById('modalLenguajes').style.display = 'none');
    document.getElementById('modalLenguajes').addEventListener('click', (e) => { if (e.target.id === 'modalLenguajes') document.getElementById('modalLenguajes').style.display = 'none'; });
    
    const plantillas = {
      html: `<h1>Hello world</h1>`,
      xml: `<?xml version="1.0"?>\n<root>\n  <item>Hola</item>\n</root>`,
      python: `def saludar():\n    print("Hola")\n\nif __name__ == "__main__":\n    saludar()`,
      cpp: `#include <iostream>\nint main() {\n    std::cout << "Hola";\n    return 0;\n}`,
      java: `public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hola");\n    }\n}`,
      css: `h1 {\n  color: #2739FF;\n  font-size: 24px;\n}`,
      csharp: `using System;\nclass Program {\n    static void Main() {\n        Console.WriteLine("Hola");\n    }\n}`,
      js: `// Hola mundo en JS\nfunction saludar() {\n  console.log("Hello world");\n}\nsaludar();`
    };

    document.getElementById('listaLenguajes').addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') {
        const lang = e.target.getAttribute('data-lang');
        const codigo = plantillas[lang];
        const s = editor.selectionStart, en = editor.selectionEnd;
        editor.value = editor.value.slice(0, s) + codigo + editor.value.slice(en);
        editor.focus();
        editor.selectionStart = editor.selectionEnd = s + codigo.length;
        actualizarTodo();
        document.getElementById('modalLenguajes').style.display = 'none';
      }
    });
  </script>
</body>
                                                                            </html>
